services:
  api:
    image: "blank:latest"
    container_name: blank
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    ports:
      - "80:80"
    command: uvicorn main:app --host 0.0.0.0 --port 80
    networks:
      - app-network

