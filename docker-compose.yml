services:
  api:
    image: "example_app_api:latest"
    container_name: example_app_api
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 80
    networks:
      - app-network

  postgres:
    image: "postgres:alpine"
    container_name: "postgres_db"
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_auth:/var/lib/postgresql/data

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_auth: